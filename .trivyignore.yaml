# Optional controls: customers can enable these via module variables. Defaults
# leave encryption as Google-managed and access logging off so we do not force
# a log bucket or CMEK on every consumer. Prefer the inline `#trivy:ignore`
# comments on google_storage_bucket.import; this file is only for scanners
# that do not honor resource comments.
#
# Scoped to main.tf so a later bucket without these controls is still flagged.
# AVD-GCP-0001 / AVD-GCP-0088 are stale names for these checks (now GCP-0066
# and GCP-0077).
misconfigurations:
  - id: AVD-GCP-0066
    paths:
      - main.tf
    statement: CMEK is optional; pass kms_crypto_key_name to enable.
  - id: GCP-0066
    paths:
      - main.tf
    statement: CMEK is optional; pass kms_crypto_key_name to enable.
  - id: AVD-GCP-0077
    paths:
      - main.tf
    statement: Access logging is optional; pass bucket_access_logs_destination for prod.
  - id: GCP-0077
    paths:
      - main.tf
    statement: Access logging is optional; pass bucket_access_logs_destination for prod.
